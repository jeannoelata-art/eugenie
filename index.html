function quiz(hear,f){const A=(hear?L:R)[tp()],n=A.length,items=[A[(2*S.n)%n],A[(2*S.n+1)%n]];let i=0,sc=0;
(function show(){const[t,q,o,a]=items[i];
app.innerHTML=`<div class=card><h2>${hear?'🎧 Écoute':'📖 Lecture'} · ${i+1}/2</h2>`+(hear?`<button class="btn s" id=pl>▶ Écouter l'audio</button><p style="margin-top:10px">Vitesse : <b id=rv>${rate}</b>x</p><input type=range id=rg min=.5 max=1.3 step=.1 value=${rate}>`:`<p class=tx>${t}</p>`)+`<p style="margin:12px 0;font-weight:700">${q}</p><div id=os>${o.map((x,k)=>`<button class=opt data-k=${k}>${x}</button>`).join('')}</div><div id=fb></div></div>`;
if(hear){let pc=0;const pe=document.getElementById('pl');pe.onclick=()=>{if(pc>=2)return toast('Comme à l\'examen : 2 écoutes maximum.');pc++;pe.textContent='▶ Réécouter ('+(2-pc)+' restante(s))';play(t)};document.getElementById('rg').oninput=e=>{rate=+e.target.value;S.rate=rate;document.getElementById('rv').textContent=rate;save()}}
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
document.querySelectorAll('.opt')[a].classList.add('ok');
if(k===a)sc+=100;else{b.classList.add('ko');ses.errs.push(`${hear?'Écoute':'Lecture'} : « ${q} » → ${o[a]}`)}
document.getElementById('fb').innerHTML=`<p class=tx>${t}</p><button class=btn id=nx>Suivant ▶</button>`;
document.getElementById('nx').onclick=()=>{i++;if(i<2)show();else{const s=Math.round(sc/2);res(hear?'🎧 Écoute terminée':'📖 Lecture terminée',s,()=>f(s))}}})})()}

function writing(f,o=0){const q=W[tp()],[p,k]=q[(S.n+o)%q.length],tg=[150,250,400][stg()];
app.innerHTML=`<div class=card><h2>✍️ Écriture</h2><p>${p}</p><p class=tx>Mots allemands à utiliser : ${k.join(' · ')}</p><textarea id=ta placeholder="Schreibe hier auf Deutsch…"></textarea><button class=btn id=ck>Vérifier mon texte</button><div id=fb></div></div>`;
document.getElementById('ck').onclick=()=>{const t=document.getElementById('ta').value,lw=t.toLowerCase(),w=t.trim().split(/\s+/).filter(Boolean).length;
const miss=k.filter(x=>!lw.includes(x)),sc=Math.min(50,Math.round(w/tg*50))+Math.round((k.length-miss.length)/k.length*50);
miss.forEach(m=>ses.errs.push(`Écriture : expression oubliée « ${m} »`));
document.getElementById('fb').innerHTML=`<p class=tx>${w} mots. ${miss.length?'À ajouter la prochaine fois : '+miss.join(', '):'Toutes les expressions sont utilisées, bravo !'}</p><button class=btn id=nx>Suivant ▶</button>`;
document.getElementById('nx').onclick=()=>res('✍️ Écriture terminée',sc,()=>f(sc))}}

function speaking(f){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,Q=P[tp()],items=[Q[(2*S.n)%Q.length],Q[(2*S.n+1)%Q.length]];let i=0,tot=0;
const nrm=s=>s.toLowerCase().replace(/[.,!?]/g,'').split(/\s+/).filter(Boolean);
(function show(){const p=items[i];
app.innerHTML=`<div class=card><h2>🗣️ Expression orale · ${i+1}/2</h2><p class=tx style="font-size:19px">${p}</p><button class="btn s" id=pl>▶ Écouter la phrase</button><button class=btn id=mic>${SR?'🎤 Répéter à voix haute':'✅ Je l\'ai dite à voix haute'}</button><div id=fb></div></div>`;
document.getElementById('pl').onclick=()=>play(p);
function done(sc,miss){tot+=sc;miss.forEach(m=>ses.errs.push(`Oral : mot à répéter « ${m} »`));
document.getElementById('fb').innerHTML=`<p class=tx>Score : ${sc}%${miss.length?'. Mots à retravailler : '+miss.join(', ')+'. Écoute puis réessaie !':' 👏'}</p><button class=btn id=nx>Suivant ▶</button>`;
document.getElementById('nx').onclick=()=>{i++;if(i<2)show();else{const s=Math.round(tot/2);res('🗣️ Expression orale terminée',s,()=>f(s))}}}
document.getElementById('mic').onclick=()=>{if(!SR)return done(80,[]);
const r=new SR();r.lang='de-DE';r.onresult=e=>{const sp=nrm(e.results[0][0].transcript),w=nrm(p),miss=w.filter(x=>!sp.includes(x));done(Math.round((w.length-miss.length)/w.length*100),miss)};
r.onerror=()=>{document.getElementById('fb').innerHTML='<p class=tx>Micro non détecté. Autorise le micro puis réessaie.</p>'};r.start()}})()}

function expr(f){const X=E[tp()],a=X[(2*S.n)%X.length],b=X[(2*S.n+1)%X.length];
app.innerHTML=`<div class=card><h2>💡 Expressions du jour</h2>${[a,b].map(e=>`<div class=tx><b>${e[0]}</b><br>= ${e[1]}<br>Plus simple : <b>${e[2]}</b></div>`).join('')}<button class="btn s" id=pl>🔊 Écouter et répéter</button><p class=tx>${T[S.n%3]}</p><button class=btn id=nx>Terminer la séance ▶</button></div>`;
document.getElementById('pl').onclick=()=>play(a[0]+'. '+b[0]);document.getElementById('nx').onclick=()=>f(null)}

function end(){const sc=ses.sc.length?Math.round(ses.sc.reduce((x,y)=>x+y,0)/ses.sc.length):0,min=Math.max(1,Math.round((Date.now()-ses.t0)/60000)),k=dk(0),o=S.days[k]||{score:0,min:0,ses:0};
S.days[k]={score:Math.round((o.score*o.ses+sc)/(o.ses+1)),min:o.min+min,ses:o.ses+1};S.n++;S.err=ses.errs.slice(0,6);save();
app.innerHTML=`<div class=card><h2>🎉 Séance terminée</h2><div class=big>${sc}%</div>${cong(sc)}<h2>Mes erreurs à retenir</h2>${ses.errs.length?ses.errs.map(e=>`<div class=tx>${e}</div>`).join(''):'<p>Aucune erreur, parfait ! 🌟</p>'}<button class=btn id=more>Continuer une autre séance ▶</button><button class="btn s" id=hm>Retour à l'accueil</button></div>${chart()}`;
document.getElementById('more').onclick=start;document.getElementById('hm').onclick=home}
home();
</script></body></html>
